<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Still photography by Victor Ivanov."
  >

  <meta
    name="theme-color"
    content="#111111"
  >

  <title>Stills — Victor Ivanov</title>

  <link
    rel="prefetch"
    href="index-v2.html"
  >

  <link
    rel="stylesheet"
    href="stills.css"
  >

  <style>
    /*
      Override the old custom cursor and reverse zoom
      inside stills.css.
    */

    .album-card {
      cursor: default;
    }

    .cursor {
      display: none !important;
    }

    .album-preview {
      opacity: 0;
      filter: none;
      transform: scale(1);
      transition:
        opacity 0.35s ease,
        transform 0.8s var(--ease);
      will-change: transform;
    }

    .album-preview.active {
      opacity: 1;
    }

    @media (hover: hover) and (pointer: fine) {
      .album-card:hover .album-preview,
      .album-card:focus-visible .album-preview {
        transform: scale(1.035);
      }
    }

    @media (max-width: 900px) {
      .album-card {
        cursor: default;
      }

      .album-preview {
        transform: scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .album-preview {
        transform: scale(1) !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <a
      class="brand"
      href="index-v2.html?return=stills"
      aria-label="Victor Ivanov, Motion"
    >
      Victor Ivanov
    </a>

    <nav
      class="nav"
      aria-label="Main navigation"
    >
      <a href="index-v2.html?return=stills">
        Motion
      </a>

      <a
        class="active"
        href="stills.html"
        aria-current="page"
      >
        Stills
      </a>

      <button
        class="nav-secondary"
        type="button"
        data-panel-open="about-panel"
      >
        About
      </button>

      <button
        class="nav-secondary"
        type="button"
        data-panel-open="contact-panel"
      >
        Contact
      </button>
    </nav>
  </header>

  <main class="page">
    <section class="intro">
      <div class="eyebrow">
        Personal photography
      </div>

      <div class="intro-row">
        <h1>Stills</h1>

        <p class="intro-copy">
          Albums, observations and photographs made between productions.
          Move across a cover to look inside.
        </p>
      </div>
    </section>

    <section
      class="albums-grid"
      id="albums-grid"
      aria-label="Photography albums"
    ></section>
  </main>

  <footer class="footer">
    <span>
      Tokyo, Japan
    </span>

    <span>
      © <span id="year"></span> Victor Ivanov
    </span>
  </footer>

  <script src="albums-data.js"></script>
  <script src="site-panels.js"></script>

  <script>
    const grid =
      document.querySelector("#albums-grid");

    const localPreview =
      location.protocol === "file:";

    const assetURL = (path) => {
      if (localPreview) {
        return `https://ivanovvitya.site/${path}`;
      }

      return `/${path.replace(/^\/+/, "")}`;
    };

    const createMedia = (photo, className) => {
      const media =
        document.createElement(
          photo.type === "video"
            ? "video"
            : "img"
        );

      media.className = className;
      media.src = assetURL(photo.src);

      if (photo.type === "video") {
        media.autoplay = true;
        media.muted = true;
        media.loop = true;
        media.playsInline = true;
        media.preload = "metadata";

        media.setAttribute(
          "aria-label",
          photo.alt
        );
      } else {
        media.alt = photo.alt;
        media.loading = "lazy";
      }

      return media;
    };

    window.STILL_ALBUMS.forEach((album) => {
      const card =
        document.createElement("a");

      card.className = "album-card";

      card.href =
        `album.html?album=${encodeURIComponent(album.slug)}`;

      card.setAttribute(
        "aria-label",
        `${album.title}, ${album.year}, ${album.photos.length} photographs`
      );

      const previews =
        album.photos.slice(0, 3);

      previews.forEach((photo, index) => {
        const media = createMedia(
          photo,
          `album-preview${index === 0 ? " active" : ""}`
        );

        card.append(media);
      });

      const dots = previews
        .map(
          (_, index) =>
            `<i class="album-dot${index === 0 ? " active" : ""}"></i>`
        )
        .join("");

      card.insertAdjacentHTML(
        "beforeend",
        `
          <span class="album-shade"></span>

          <span class="album-dots">
            ${dots}
          </span>

          <span class="album-info">
            <h2 class="album-title">
              ${album.title}
            </h2>

            <span class="album-meta">
              ${album.year}<br>
              ${album.photos.length} images
            </span>
          </span>
        `
      );

      const setActivePreview = (activeIndex) => {
        card
          .querySelectorAll(".album-preview")
          .forEach((item, index) => {
            item.classList.toggle(
              "active",
              index === activeIndex
            );
          });

        card
          .querySelectorAll(".album-dot")
          .forEach((item, index) => {
            item.classList.toggle(
              "active",
              index === activeIndex
            );
          });
      };

      card.addEventListener(
        "pointermove",
        (event) => {
          if (previews.length < 2) {
            return;
          }

          const rect =
            card.getBoundingClientRect();

          const pointerPosition =
            (event.clientX - rect.left) /
            rect.width;

          const activeIndex = Math.min(
            previews.length - 1,
            Math.max(
              0,
              Math.floor(
                pointerPosition *
                previews.length
              )
            )
          );

          setActivePreview(activeIndex);
        }
      );

      card.addEventListener(
        "pointerleave",
        () => {
          setActivePreview(0);
        }
      );

      card.addEventListener(
        "focus",
        () => {
          setActivePreview(0);
        }
      );

      card.addEventListener(
        "blur",
        () => {
          setActivePreview(0);
        }
      );

      grid.append(card);
    });

    document.querySelector("#year").textContent =
      new Date().getFullYear();
  </script>
</body>
</html>
