<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Victor Ivanov — Director of Photography based in Tokyo.">
  <meta name="theme-color" content="#111111">
  <title>Victor Ivanov — Director of Photography</title>

  <link rel="prefetch" href="stills.html">

  <script>
    (() => {
      const returning = new URLSearchParams(location.search).has("return");

      try {
        const seen = sessionStorage.getItem("vi-intro-seen");

        if (returning || seen) {
          document.documentElement.classList.add("intro-seen");
        }

        sessionStorage.setItem("vi-intro-seen", "true");
      } catch {
        if (returning) {
          document.documentElement.classList.add("intro-seen");
        }
      }

      if (returning) {
        history.replaceState(null, "", location.pathname + location.hash);
      }
    })();
  </script>

  <style>
    @view-transition {
      navigation: auto;
    }

    :root {
      --black: #111;
      --white: #f0f0ed;
      --grey: #8d8d89;
      --header: 94px;
      --line: rgba(255, 255, 255, 0.15);
      --ease: cubic-bezier(0.22, 0.72, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--black);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--black);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.locked {
      overflow: hidden;
    }

    a {
      color: inherit;
    }

    button {
      color: inherit;
      font: inherit;
    }

    img,
    video {
      display: block;
      width: 100%;
    }

    ::selection {
      color: var(--black);
      background: var(--white);
    }

    .skip-link {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 200;
      padding: 10px 14px;
      color: var(--black);
      background: var(--white);
      transform: translateY(-160%);
    }

    .skip-link:focus {
      transform: none;
    }

    .splash {
      position: fixed;
      inset: 0;
      z-index: 150;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      color: var(--black);
      background: var(--white);
      pointer-events: none;
      animation: leave 1s var(--ease) 1.05s forwards;
    }

    .intro-seen .splash {
      display: none;
    }

    .splash-name {
      font-size: clamp(48px, 10vw, 150px);
      line-height: 0.82;
      letter-spacing: -0.075em;
      text-transform: uppercase;
    }

    .splash-bottom {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    @keyframes leave {
      to {
        transform: translateY(-102%);
      }
    }

    .header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 50;
      height: var(--header);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 22px;
      background: rgba(17, 17, 17, 0.92);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .brand {
      width: max-content;
      color: var(--white);
      font-size: clamp(25px, 2.6vw, 38px);
      line-height: 1;
      letter-spacing: -0.035em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: clamp(18px, 2.4vw, 38px);
    }

    .nav button,
    .nav a,
    .filters button {
      position: relative;
      padding: 2px 0;
      border: 0;
      background: none;
      color: #999;
      font-size: 11px;
      line-height: 1;
      letter-spacing: 0.04em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.25s ease;
    }

    .nav button::after,
    .nav a::after,
    .filters button::after {
      content: "";
      position: absolute;
      inset: auto 0 -5px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.35s var(--ease);
    }

    .nav button:hover,
    .nav a:hover,
    .nav button:focus-visible,
    .nav a:focus-visible,
    .nav a.active,
    .filters button:hover,
    .filters button:focus-visible,
    .filters button.active {
      color: var(--white);
      outline: none;
    }

    .nav button:hover::after,
    .nav a:hover::after,
    .nav a.active::after,
    .filters button:hover::after,
    .filters button.active::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .filters {
      position: sticky;
      top: var(--header);
      z-index: 40;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 22px;
      background: rgba(17, 17, 17, 0.88);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .filters .label {
      margin-right: auto;
      color: #666;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    main {
      padding-top: var(--header);
    }

    .work-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
      padding-top: 42px;
      background: var(--black);
    }

    .project {
      position: relative;
      min-width: 0;
      aspect-ratio: 1.28 / 1;
      overflow: hidden;
      color: var(--white);
      background: #202020;
      text-decoration: none;
      cursor: default;
      isolation: isolate;
      transition:
        opacity 0.5s var(--ease),
        transform 0.5s var(--ease);
    }

    .project.hidden {
      display: none;
    }

    .work-grid.has-focus .project:not(:hover):not(:focus-visible) {
      opacity: 0.4;
    }

    .project-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: none;
      transform: none;
      transition: opacity 0.5s ease;
    }

    .project:focus-visible {
      outline: 2px solid var(--white);
      outline-offset: -2px;
    }

    .project-shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.18),
          transparent 35%,
          transparent 55%,
          rgba(0, 0, 0, 0.82)
        );
      opacity: 0.35;
      transition: opacity 0.45s ease;
    }

    .project:hover .project-shade,
    .project:focus-visible .project-shade {
      opacity: 1;
    }

    .project-index {
      position: absolute;
      top: 16px;
      left: 17px;
      z-index: 2;
      font-size: 9px;
      letter-spacing: 0.12em;
      opacity: 0;
      transform: translateY(-6px);
      transition: 0.4s var(--ease);
    }

    .project-info {
      position: absolute;
      inset: auto 17px 15px;
      z-index: 2;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
      opacity: 0;
      transform: translateY(12px);
      transition: 0.45s var(--ease);
    }

    .project:hover .project-info,
    .project:hover .project-index,
    .project:focus-visible .project-info,
    .project:focus-visible .project-index {
      opacity: 1;
      transform: none;
    }

    .project-title {
      max-width: 28ch;
      margin: 0;
      font-size: clamp(18px, 1.65vw, 27px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.035em;
      text-transform: uppercase;
    }

    .project-meta {
      font-size: 9px;
      line-height: 1.45;
      letter-spacing: 0.1em;
      text-align: right;
      text-transform: uppercase;
    }

    .missing-media::before {
      content: "VI";
      position: absolute;
      inset: 50% auto auto 50%;
      color: #333;
      font-size: clamp(70px, 10vw, 160px);
      letter-spacing: -0.08em;
      transform: translate(-50%, -50%);
    }

    .footer {
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 22px 22px;
      border-top: 1px solid var(--line);
    }

    .footer-kicker {
      color: var(--grey);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .footer-mail {
      align-self: center;
      margin: auto 0;
      font-size: clamp(43px, 8vw, 122px);
      line-height: 0.82;
      letter-spacing: -0.065em;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
    }

    .footer-mail span {
      display: block;
      color: #555;
      transition: color 0.3s ease;
    }

    .footer-mail:hover span {
      color: var(--white);
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      color: var(--grey);
      font-size: 10px;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      text-decoration: none;
    }

    .about-panel {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 90;
      width: min(560px, 100%);
      display: flex;
      flex-direction: column;
      padding: 24px;
      color: var(--black);
      background: var(--white);
      transform: translateX(102%);
      transition: transform 0.65s var(--ease);
    }

    .about-panel.open {
      transform: none;
    }

    .about-top {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .about-close {
      padding: 0;
      border: 0;
      color: inherit;
      background: none;
      cursor: pointer;
      text-transform: uppercase;
    }

    .about-copy {
      margin: auto 0;
      font-size: clamp(32px, 4vw, 55px);
      line-height: 0.95;
      letter-spacing: -0.045em;
      text-transform: uppercase;
    }

    .about-copy span {
      color: #a5a5a0;
    }

    .about-bottom {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .panel-action {
      padding: 0;
      border: 0;
      border-bottom: 1px solid currentColor;
      color: inherit;
      background: none;
      font-size: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }

    .panel-scrim {
      position: fixed;
      inset: 0;
      z-index: 80;
      visibility: hidden;
      background: rgba(0, 0, 0, 0.62);
      opacity: 0;
      transition: 0.4s ease;
    }

    .panel-scrim.open {
      visibility: visible;
      opacity: 1;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: clamp(14px, 4vw, 56px);
      visibility: hidden;
      opacity: 0;
      background: rgba(8, 8, 8, 0.96);
      transition: 0.35s ease;
    }

    .modal.open {
      visibility: visible;
      opacity: 1;
    }

    .modal-inner {
      width: min(1240px, 100%);
    }

    .modal-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: clamp(17px, 2vw, 26px);
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .modal-close {
      padding: 5px 0;
      border: 0;
      background: none;
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .player {
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .player iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 900px) {
      :root {
        --header: 78px;
      }

      .header {
        padding: 0 16px;
      }

      .nav {
        gap: 16px;
      }

      .filters {
        padding: 0 16px;
        overflow-x: auto;
      }

      .filters .label {
        display: none;
      }

      .work-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px;
      }

      .project {
        cursor: default;
      }

      .project-media {
        filter: none;
        transform: none;
      }

      .project-shade {
        opacity: 0.8;
      }

      .project-info,
      .project-index {
        opacity: 1;
        transform: none;
      }

      .work-grid.has-focus .project:not(:hover):not(:focus-visible) {
        opacity: 1;
      }
    }

    @media (max-width: 580px) {
      .brand {
        font-size: 23px;
      }

      .nav {
        gap: 14px;
      }

      .nav-secondary {
        display: none;
      }

      .filters {
        gap: 17px;
      }

      .work-grid {
        grid-template-columns: 1fr;
      }

      .project {
        aspect-ratio: 1.15 / 1;
      }

      .project-title {
        font-size: 23px;
      }

      .footer {
        min-height: 70svh;
        padding-inline: 16px;
      }

      .footer-bottom {
        align-items: end;
      }

      .footer-links {
        flex-direction: column;
        gap: 7px;
      }

      .about-panel {
        padding: 18px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }

      .splash {
        display: none;
      }

      .project-media {
        transform: none !important;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#work">Skip to work</a>

  <div class="splash" aria-hidden="true">
    <div class="splash-name">
      Victor<br>
      Ivanov
    </div>

    <div class="splash-bottom">
      <span>Director of Photography</span>
      <span>Tokyo, Japan</span>
    </div>
  </div>

  <header class="header">
    <a class="brand" href="#work" aria-label="Victor Ivanov, work">
      Victor Ivanov
    </a>

    <nav class="nav" aria-label="Main navigation">
      <a class="active" href="#work" aria-current="page">Motion</a>
      <a href="stills.html">Stills</a>

      <button
        class="nav-secondary"
        type="button"
        data-panel-open="about-panel"
      >
        About
      </button>

      <button
        class="nav-secondary"
        type="button"
        data-panel-open="contact-panel"
      >
        Contact
      </button>
    </nav>
  </header>

  <main>
    <div class="filters" aria-label="Filter projects">
      <span class="label">Selected works — 2022–2026</span>

      <button class="active" type="button" data-filter="All">
        All
      </button>

      <button type="button" data-filter="Commercial">
        Commercial
      </button>

      <button type="button" data-filter="Music Film">
        Music
      </button>

      <button type="button" data-filter="Editorial">
        Editorial
      </button>
    </div>

    <section
      class="work-grid"
      id="work"
      aria-label="Selected projects"
    ></section>

    <footer class="footer" id="contact">
      <div class="footer-kicker">
        Based in Tokyo
      </div>

      <a class="footer-mail" href="mailto:victor@push.xyz">
        Let’s make
        <span>something.</span>
      </a>

      <div class="footer-bottom">
        <div class="footer-links">
          <a
            href="https://instagram.com/ivanovvitya"
            target="_blank"
            rel="noreferrer"
          >
            Instagram
          </a>

          <a href="mailto:victor@push.xyz">
            Email
          </a>

          <a href="#work">
            Back to top ↑
          </a>
        </div>

        <span>
          © <span id="year"></span> Victor Ivanov
        </span>
      </div>
    </footer>
  </main>

  <div
    class="modal"
    id="modal"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modal-title"
  >
    <div class="modal-inner">
      <div class="modal-bar">
        <div class="modal-title" id="modal-title"></div>

        <button
          class="modal-close"
          id="modal-close"
          type="button"
        >
          Close ×
        </button>
      </div>

      <div class="player">
        <iframe
          id="player"
          title="Project film"
          allow="autoplay; fullscreen; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
    </div>
  </div>

  <script src="site-panels.js"></script>

  <script>
    const projects = [
      {
        title: "BEATS: Mood Swings",
        category: "Commercial",
        year: "2025",
        media: "thumbs/11.BEATSMIHO.jpg",
        embed: "https://player.vimeo.com/video/1023895414?autoplay=1&title=0&byline=0&portrait=0"
      },
      {
        title: "Jeshi — Inside Out",
        category: "Music Film",
        year: "2023",
        media: "thumbs/01.jpg",
        embed: "https://player.vimeo.com/video/893163017?autoplay=1&title=0&byline=0&portrait=0"
      },
      {
        title: "Arlo Parks — Purple Phase",
        category: "Music Film",
        year: "2023",
        media: "thumbs/02.jpg",
        embed: "https://player.vimeo.com/video/873990921?autoplay=1&title=0&byline=0&portrait=0"
      },
      {
        title: "Tomorrow Is Today",
        category: "Editorial",
        year: "2023",
        media: "thumbs/03.jpg",
        embed: "https://player.vimeo.com/video/873997023?autoplay=1&title=0&byline=0&portrait=0"
      },
      {
        title: "Miso Extra — Right Here",
        category: "Music Film",
        year: "2024",
        media: "thumbs/14MISO.jpg",
        embed: "https://www.youtube.com/embed/wgI1OiKwE0A?autoplay=1&rel=0"
      },
      {
        title: "Uniqlo — Gifts for All",
        category: "Commercial",
        year: "2024",
        media: "thumbs/13.UNIQLO.mp4",
        video: true,
        embed: "https://www.youtube.com/embed/0j5cAMrWb6w?autoplay=1&rel=0"
      },
      {
        title: "Jacob Collier — Little Blue",
        category: "Music Film",
        year: "2023",
        media: "thumbs/04.jpg",
        embed: "https://player.vimeo.com/video/874000916?autoplay=1&title=0&byline=0&portrait=0"
      },
      {
        title: "Rauw Alejandro × Crocs",
        category: "Commercial",
        year: "2024",
        media: "thumbs/09RAUW_1.mp4",
        video: true,
        embed: "https://www.youtube.com/embed/5zpYEeFPwjM?autoplay=1&rel=0"
      },
      {
        title: "Xamiya — Monster",
        category: "Music Film",
        year: "2024",
        media: "thumbs/05XAMIYAMONSTER.jpg",
        embed: "https://www.youtube.com/embed/LbA3vdTyC3c?autoplay=1&rel=0"
      },
      {
        title: "Beats — Defy The Noise",
        category: "Commercial",
        year: "2022",
        media: "thumbs/12.BEATSAK.jpg",
        embed: "https://player.vimeo.com/video/774727914?autoplay=1&title=0&byline=0&portrait=0"
      },
      {
        title: "OnePlus Buds 4",
        category: "Commercial",
        year: "2025",
        media: "thumbs/06ONEPLUS.jpg",
        embed: "https://www.youtube.com/embed/-L5Z-4t3RLA?autoplay=1&rel=0"
      },
      {
        title: "Fuku Wa Uchi Oni Wa Soto",
        category: "Music Film",
        year: "2025",
        media: "thumbs/07JCKMV.jpg",
        embed: "https://www.youtube.com/embed/TLxa-jEgAgY?autoplay=1&rel=0"
      },
      {
        title: "Billie Eilish × VERBAL",
        category: "Editorial",
        year: "2024",
        media: "thumbs/08BILLECOMPLEX.jpg",
        embed: "https://www.youtube.com/embed/7OU3EyCXCso?autoplay=1&rel=0&start=329"
      },
      {
        title: "July Suitcases",
        category: "Commercial",
        year: "2024",
        media: "thumbs/JULY.jpg",
        embed: "https://www.youtube.com/embed/XNMsvl5PykQ?autoplay=1&rel=0"
      },
      {
        title: "American Tourister",
        category: "Commercial",
        year: "2024",
        media: "thumbs/AMERICAN.jpg",
        embed: "https://www.youtube.com/embed/R4BPaxrzkDQ?autoplay=1&rel=0"
      }
    ];

    const $ = (selector) => document.querySelector(selector);

    const grid = $("#work");

    const localPreview = location.protocol === "file:";

    const assetURL = (path) => {
      if (localPreview) {
        return `https://ivanovvitya.site/${path}`;
      }

      return `/${path.replace(/^\/+/, "")}`;
    };

    projects.forEach((project, index) => {
      const card = document.createElement("a");

      card.className = "project";
      card.href = project.embed;
      card.dataset.embed = project.embed;
      card.dataset.title = project.title;
      card.dataset.category = project.category;

      const media = project.video
        ? document.createElement("video")
        : document.createElement("img");

      media.className = "project-media";
      media.src = assetURL(project.media);

      if (project.video) {
        media.autoplay = true;
        media.muted = true;
        media.loop = true;
        media.playsInline = true;
        media.preload = "metadata";
        media.setAttribute("aria-label", project.title);
      } else {
        media.alt = project.title;
        media.loading = index < 6 ? "eager" : "lazy";
      }

      media.addEventListener("error", () => {
        card.classList.add("missing-media");
      });

      card.append(media);

      card.insertAdjacentHTML(
        "beforeend",
        `
          <span class="project-shade"></span>

          <span class="project-index">
            ${String(index + 1).padStart(2, "0")} /
            ${String(projects.length).padStart(2, "0")}
          </span>

          <span class="project-info">
            <h2 class="project-title">
              ${project.title}
            </h2>

            <span class="project-meta">
              ${project.category}
            </span>
          </span>
        `
      );

      grid.append(card);
    });

    grid.addEventListener("pointerover", (event) => {
      if (event.target.closest(".project")) {
        grid.classList.add("has-focus");
      }
    });

    grid.addEventListener("pointerleave", () => {
      grid.classList.remove("has-focus");
    });

    document.querySelectorAll(".filters button").forEach((button) => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".filters button").forEach((item) => {
          item.classList.toggle("active", item === button);
        });

        document.querySelectorAll(".project").forEach((card) => {
          const shouldHide =
            button.dataset.filter !== "All" &&
            card.dataset.category !== button.dataset.filter;

          card.classList.toggle("hidden", shouldHide);
        });
      });
    });

    const modal = $("#modal");
    const player = $("#player");

    let previousFocus = null;

    const openModal = (card) => {
      previousFocus = document.activeElement;

      player.src = card.dataset.embed;
      $("#modal-title").textContent = card.dataset.title;

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");

      document.body.classList.add("locked");

      $("#modal-close").focus();
    };

    const closeModal = () => {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");

      document.body.classList.remove("locked");

      player.src = "";

      if (previousFocus) {
        previousFocus.focus();
      }
    };

    grid.addEventListener("click", (event) => {
      const card = event.target.closest(".project");

      if (!card) {
        return;
      }

      event.preventDefault();
      openModal(card);
    });

    $("#modal-close").addEventListener("click", closeModal);

    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") {
        return;
      }

      if (modal.classList.contains("open")) {
        closeModal();
      }
    });

    $("#year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
